<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1320 560" role="img" aria-label="Female arm: from two blood cohorts to a chromatin-remodelling competence readout" xmlns="http://www.w3.org/2000/svg" style="color:#1B2430;max-width:100%;height:auto;font-family:IBM Plex Sans,system-ui,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B2430"/></marker></defs>
<rect x="20" y="14" width="290" height="3" fill="#0E6F6C"/><text x="20" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">1  DISCOVERY</text><text x="20" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">two blood cohorts · 145 women (86 RA / 59 HC)</text>
<rect x="350" y="14" width="290" height="3" fill="#0E6F6C"/><text x="350" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">2  MECHANISM</text><text x="350" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">what do these genes have in common?</text>
<rect x="680" y="14" width="290" height="3" fill="#0E6F6C"/><text x="680" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">3  VALIDATION</text><text x="680" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">does it hold outside the discovery set?</text>
<rect x="1010" y="14" width="290" height="3" fill="#0E6F6C"/><text x="1010" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">4  ACTION</text><text x="1010" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">if it holds: what the readout is for</text>
<rect x="20" y="72" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="30" y="94" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Blood expression: RA vs control</text>
<text x="30" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">5,131 DEGs at FDR &lt; 0.05; 2,709 survive</text>
<text x="30" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">leukocyte-composition adjustment (49 %)</text>
<text x="30" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">brown module (1,878 genes, r = -0.59):</text>
<text x="30" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">spliceosome, chromatin remodelling, PRC</text>
<rect x="20" y="178" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="30" y="200" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">cis-MR prioritisation (eQTLGen → Okada)</text>
<text x="30" y="221" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11.5px;font-weight:normal;">SMARCC2  OR 0.76   MED1  OR 0.73</text>
<text x="30" y="236" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11.5px;font-weight:normal;">IKZF3    OR 1.17   CDC37 OR 0.75</text>
<text x="30" y="251" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">· no gene colocalises (IKZF3 PP.H4 0.77)</text>
<text x="30" y="266" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">· MR = genetically informed filter only</text>
<rect x="20" y="284" width="290" height="98" rx="6" fill="#FFFFFF" stroke="#0E6F6C" stroke-width="1.6"/>
<text x="30" y="306" text-anchor="start" fill="#0E6F6C" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">MHC-free female panel</text>
<text x="30" y="327" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11.5px;font-weight:normal;">CDC37 · IKZF3 · MED1 · SMARCC2</text>
<text x="30" y="342" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">all four down in RA; 4/4 keep 62–80 %</text>
<text x="30" y="357" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">of their effect after composition adjustment</text>
<text x="30" y="372" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">consensus of LASSO ∩ RF ∩ SVM-RFE</text>
<line x1="314" y1="333.0" x2="346" y2="333.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="350" y="72" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="360" y="94" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Shared identity: transcriptional machinery</text>
<text x="360" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">SMARCC2 = SWI/SNF (BAF) scaffold subunit</text>
<text x="360" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">MED1 = Mediator, nuclear-receptor docking</text>
<text x="360" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">CDC37 = kinase co-chaperone (HSP90)</text>
<text x="360" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">IKZF3 = Aiolos, lymphoid chromatin TF</text>
<line x1="380" y1="170" x2="380" y2="190" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="350" y="192" width="290" height="128" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="360" y="214" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Pathways suppressed in female RA blood</text>
<text x="360" y="235" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">KEGG ATP-dependent chromatin remodelling</text>
<text x="360" y="250" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  NES -2.02, padj 3.6e-4; SMARCC2 in edge</text>
<text x="360" y="265" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">KEGG thyroid hormone signalling</text>
<text x="360" y="280" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  NES -1.57 (MED1, NCOA1, NCOR1, THRA)</text>
<text x="360" y="295" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">GO nuclear-receptor coactivator activity</text>
<text x="360" y="310" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  padj 3.5e-6; ESR1, AR, NR3C1 unchanged</text>
<line x1="380" y1="320" x2="380" y2="340" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="350" y="342" width="290" height="128" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="360" y="364" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Hypothesis: hormone-response competence</text>
<text x="360" y="385" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">coregulator loss → blunted glucocorticoid,</text>
<text x="360" y="400" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">thyroid / oestrogen receptor transcription</text>
<text x="360" y="415" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">SWI/SNF loss → weaker T-cell activation</text>
<text x="360" y="430" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">programme (AP-1); MED1 loss → CD8 T-cell</text>
<text x="360" y="445" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">upkeep via IL-7R (CD8 fraction 0.16 → 0.09)</text>
<text x="360" y="460" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">→ aberrant lymphocyte state → RA</text>
<line x1="644" y1="406.0" x2="676" y2="406.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="680" y="72" width="290" height="113" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="690" y="94" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Blood, done</text>
<text x="690" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">nested CV AUC 0.80 (0.73–0.87), n 145</text>
<text x="690" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">sealed hold-out 0.81 (0.69–0.92), n 61</text>
<text x="690" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">external PBMC GSE15573 0.74, n 24</text>
<text x="690" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">beats cell-fraction-only model, 3 of 3 sets</text>
<text x="690" y="175" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">net benefit &gt; treat-all at 20 % and 50 %</text>
<rect x="680" y="193" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="690" y="215" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Tissue and genetics, done</text>
<text x="690" y="236" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">SMARCC2 down in RA synovium, FDR 1e-32,</text>
<text x="690" y="251" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  AUC 0.996 (GSE89408, 120 women)</text>
<text x="690" y="266" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">MED1 and IKZF3 reverse in synovium</text>
<text x="690" y="281" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">SMARCC2 MR replicates in Stahl (OR 0.76)</text>
<rect x="680" y="299" width="290" height="128" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="690" y="321" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Still owed</text>
<text x="690" y="342" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">qPCR of the 4 genes, independent cohort</text>
<text x="690" y="357" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">sorted CD8 T cells and monocytes:</text>
<text x="690" y="372" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  which cell carries the SMARCC2/MED1 loss?</text>
<text x="690" y="387" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">SMARCC2 / MED1 promoter methylation in</text>
<text x="690" y="402" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  your sorted CD4+ methylation data</text>
<text x="690" y="417" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">glucocorticoid response vs panel score</text>
<line x1="974" y1="363.0" x2="1006" y2="363.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1010" y="72" width="290" height="98" rx="6" fill="#FFFFFF" stroke="#0E6F6C" stroke-width="1.6"/>
<text x="1020" y="94" text-anchor="start" fill="#0E6F6C" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">The readout</text>
<text x="1020" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">SMARCC2 + MED1 expression</text>
<text x="1020" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">= chromatin-remodelling and</text>
<text x="1020" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">nuclear-receptor competence readout</text>
<text x="1020" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">in circulating leukocytes</text>
<line x1="1040" y1="170" x2="1040" y2="190" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1010" y="192" width="290" height="83" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="1020" y="214" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Diagnostic use, supported</text>
<text x="1020" y="235" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">4-gene MHC-free panel + nomogram</text>
<text x="1020" y="250" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">female diagnosis, RA vs healthy</text>
<text x="1020" y="265" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">calibration MAE 0.036 (bootstrap)</text>
<line x1="1040" y1="275" x2="1040" y2="295" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="1010" y="297" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="1020" y="319" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Stratification use, hypothesis</text>
<text x="1020" y="340" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">low coregulator score → predict poor</text>
<text x="1020" y="355" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">glucocorticoid response; stratify before</text>
<text x="1020" y="370" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">steroid or nuclear-receptor therapy;</text>
<text x="1020" y="385" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">test in a treated cohort with outcomes</text>
<rect x="20" y="530" width="26" height="14" rx="3" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="52" y="541" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:10.5px;font-weight:normal;">supported by a table in results/tables</text>
<rect x="280" y="530" width="26" height="14" rx="3" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="312" y="541" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:10.5px;font-weight:normal;">hypothesis or work still to do</text>
<rect x="490" y="530" width="26" height="14" rx="3" fill="#FFFFFF" stroke="#0E6F6C" stroke-width="1.6"/>
<text x="522" y="541" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:10.5px;font-weight:normal;">the target: what this sex&#x27;s panel actually measures</text>
</svg>