<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1320 560" role="img" aria-label="Male arm, exploratory: a metabolic-inflammatory axis anchored on NCOA5, TAB1 and PTPN22" xmlns="http://www.w3.org/2000/svg" style="color:#1B2430;max-width:100%;height:auto;font-family:IBM Plex Sans,system-ui,sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1B2430"/></marker></defs>
<rect x="20" y="14" width="290" height="3" fill="#B65A12"/><text x="20" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">1  DISCOVERY</text><text x="20" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">38 men (17 RA / 21 HC) · exploratory throughout</text>
<rect x="350" y="14" width="290" height="3" fill="#B65A12"/><text x="350" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">2  MECHANISM</text><text x="350" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">what is male about this set?</text>
<rect x="680" y="14" width="290" height="3" fill="#B65A12"/><text x="680" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">3  VALIDATION</text><text x="680" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">can 38 men support this?</text>
<rect x="1010" y="14" width="290" height="3" fill="#B65A12"/><text x="1010" y="38" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:13px;font-weight:600;">4  ACTION</text><text x="1010" y="54" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:11px;font-weight:normal;">only after replication</text>
<rect x="20" y="72" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="30" y="94" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Blood expression: RA vs control</text>
<text x="30" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">5,820 DEGs; only 1,450 survive composition</text>
<text x="30" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">adjustment (24 %): CD8 ↓, γδ T ↑, eosinophils ↑</text>
<text x="30" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">GSEA: TCA cycle, glycolysis, carbon</text>
<text x="30" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">metabolism, FcγR phagosome, lysosome ↓</text>
<rect x="20" y="178" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="30" y="200" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Sex-differential signal (interaction test)</text>
<text x="30" y="221" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">35 of 53 interaction genes male-restricted;</text>
<text x="30" y="236" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">6 survive composition: MAP4K5 BCLAF1</text>
<text x="30" y="251" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  ZNF800 RIF1 UBXN4 RAB2A (no RA papers)</text>
<text x="30" y="266" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">PTPN22 up 5× more in men (0.89 vs 0.17)</text>
<rect x="20" y="284" width="290" height="98" rx="6" fill="#FFFFFF" stroke="#B65A12" stroke-width="1.6"/>
<text x="30" y="306" text-anchor="start" fill="#B65A12" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">MHC-free male panel</text>
<text x="30" y="327" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Mono', ui-monospace, Menlo, monospace;font-size:11.5px;font-weight:normal;">MED1 · NCOA5 · PHF19 · SMARCC2 · TAB1</text>
<text x="30" y="342" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">NCOA5 OR 0.42 · TAB1 OR 0.43 · PHF19 0.79</text>
<text x="30" y="357" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">all down in RA blood; MED1 and SMARCC2</text>
<text x="30" y="372" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">shared with the female panel</text>
<line x1="314" y1="333.0" x2="346" y2="333.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="350" y="72" width="290" height="128" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="360" y="94" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Gene identities with a male bias in the literature</text>
<text x="360" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">NCOA5 = oestrogen-receptor coregulator;</text>
<text x="360" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  loss → IL-6 ↑ and glucose intolerance</text>
<text x="360" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  only in male mice (Cancer Cell 2013)</text>
<text x="360" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">TAB1 = TAK1 activator → NF-κB / MAPK</text>
<text x="360" y="175" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">MAP4K5 = JNK-pathway kinase, no RA study</text>
<text x="360" y="190" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">PTPN22 1858T allele enriched in male RA</text>
<line x1="380" y1="200" x2="380" y2="220" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="350" y="222" width="290" height="128" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="360" y="244" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Pathways suppressed in male RA blood</text>
<text x="360" y="265" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">KEGG insulin signalling NES -1.45, p 0.011</text>
<text x="360" y="280" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">KEGG insulin resistance NES -1.48, p 0.014</text>
<text x="360" y="295" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">KEGG thyroid hormone signalling NES -1.50</text>
<text x="360" y="310" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  (p 0.008; MED1 leading edge)</text>
<text x="360" y="325" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">· adjusted p 0.08–0.10: nominal only</text>
<text x="360" y="340" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">· oestrogen and androgen KEGG maps: null</text>
<line x1="380" y1="350" x2="380" y2="370" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="350" y="372" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="360" y="394" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Hypothesis: metabolic-inflammatory axis</text>
<text x="360" y="415" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">NCOA5 ↓ → IL-6 ↑ + insulin resistance;</text>
<text x="360" y="430" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">TAB1/TAK1 and MAP4K5 → NF-κB / JNK tone;</text>
<text x="360" y="445" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">PTPN22 ↑ → altered TCR threshold</text>
<text x="360" y="460" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">→ metabolic-inflammatory axis → RA in men</text>
<line x1="644" y1="421.0" x2="676" y2="421.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="680" y="72" width="290" height="128" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="690" y="94" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Done, but power-limited</text>
<text x="690" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">nested CV AUC 0.92 (0.84–1.00), n 38</text>
<text x="690" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">hold-out n 13: perfect separation, no number</text>
<text x="690" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">external PBMC n 9: 0.70 (0.40–1.00)</text>
<text x="690" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">SMARCC2 in synovium: AUC 0.98 (60 men)</text>
<text x="690" y="175" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">TAB1 transfers to East Asians (OR 0.19)</text>
<text x="690" y="190" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">NCOA5 East Asian OR 0.51 (p 0.009)</text>
<rect x="680" y="208" width="290" height="128" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="690" y="230" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Still owed before any claim</text>
<text x="690" y="251" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">a male-enriched cohort (≥ 100 men) to</text>
<text x="690" y="266" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  re-test the panel + 6 interaction genes</text>
<text x="690" y="281" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">serum IL-6 and HbA1c vs NCOA5 expression</text>
<text x="690" y="296" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">PTPN22 1858 genotype vs expression by sex</text>
<text x="690" y="311" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">  (is the 5× male effect allelic?)</text>
<text x="690" y="326" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">sorted monocytes: TAB1 / MAP4K5 signalling</text>
<line x1="974" y1="272.0" x2="1006" y2="272.0" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)"/>
<rect x="1010" y="72" width="290" height="98" rx="6" fill="#FFFFFF" stroke="#B65A12" stroke-width="1.6"/>
<text x="1020" y="94" text-anchor="start" fill="#B65A12" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">The readout (exploratory)</text>
<text x="1020" y="115" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">NCOA5 + TAB1 expression with PTPN22</text>
<text x="1020" y="130" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">= metabolic-inflammatory tone readout</text>
<text x="1020" y="145" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">candidate only; no diagnostic claim</text>
<text x="1020" y="160" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">rests on the male panel today</text>
<line x1="1040" y1="170" x2="1040" y2="190" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="1010" y="192" width="290" height="98" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="1020" y="214" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Sex-differential markers, hypothesis-generating</text>
<text x="1020" y="235" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">first male-restricted RA expression</text>
<text x="1020" y="250" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">candidates: MAP4K5, BCLAF1, ZNF800,</text>
<text x="1020" y="265" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">RIF1, UBXN4, RAB2A</text>
<text x="1020" y="280" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">join key for the methylation chapter</text>
<line x1="1040" y1="290" x2="1040" y2="310" stroke="currentColor" stroke-width="1.4" marker-end="url(#ah)" stroke-dasharray="6 4"/>
<rect x="1010" y="312" width="290" height="83" rx="6" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="1020" y="334" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:600;">Stratification use, hypothesis</text>
<text x="1020" y="355" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">if NCOA5–IL-6 replicates: IL-6- or</text>
<text x="1020" y="370" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">TAK1-directed stratification in men</text>
<text x="1020" y="385" text-anchor="start" fill="#1B2430" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:12px;font-weight:normal;">with metabolic comorbidity</text>
<rect x="20" y="530" width="26" height="14" rx="3" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1"/>
<text x="52" y="541" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:10.5px;font-weight:normal;">supported by a table in results/tables</text>
<rect x="280" y="530" width="26" height="14" rx="3" fill="#FFFFFF" stroke="currentColor" stroke-width="1.1" stroke-dasharray="6 4"/>
<text x="312" y="541" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:10.5px;font-weight:normal;">hypothesis or work still to do</text>
<rect x="490" y="530" width="26" height="14" rx="3" fill="#FFFFFF" stroke="#B65A12" stroke-width="1.6"/>
<text x="522" y="541" text-anchor="start" fill="#5B6672" style="font-family:'IBM Plex Sans', system-ui, sans-serif;font-size:10.5px;font-weight:normal;">the target: what this sex&#x27;s panel actually measures</text>
</svg>